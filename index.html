<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Group Room — Human, ChatGPT, Claude & Gemini</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; max-width: 920px; margin: 1.5rem auto; padding: 0 1rem; }
    h1 { color: #58a6ff; margin: 0; font-size: 1.5rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .card, .chat-box, .composer { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .brief-card { border-left: 4px solid #58a6ff; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 0.8rem; }
    @media (max-width: 720px) { .grid-3 { grid-template-columns: 1fr; } }
    label { font-size: 0.8rem; font-weight: 600; color: #8b949e; display: block; }
    input[type="text"], input[type="password"], textarea { width: 100%; box-sizing: border-box; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 0.55rem; margin-top: 0.25rem; font-family: inherit; }
    textarea.brief-box { border-color: #388bfd66; background: #0d1117; line-height: 1.45; }
    button { background: #238636; color: #fff; font-weight: 600; border: none; border-radius: 6px; padding: 0.55rem 1rem; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #2ea043; }
    button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    button.secondary { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
    button.secondary:hover { background: #30363d; }
    button.danger { background: #da3633; }
    button.danger:hover { background: #f85149; }
    .chat-box { height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { padding: 0.8rem 1rem; border-radius: 6px; line-height: 1.5; max-width: 88%; }
    .human { background: #1f2937; border-right: 4px solid #f0883e; align-self: flex-end; }
    .chatgpt { background: #142420; border-left: 4px solid #10a37f; align-self: flex-start; }
    .claude { background: #261c17; border-left: 4px solid #d97757; align-self: flex-start; }
    .gemini { background: #162033; border-left: 4px solid #4285f4; align-self: flex-start; }
    .sender { font-weight: bold; font-size: 0.8rem; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; gap: 1rem; }
    .human .sender { color: #f0883e; }
    .chatgpt .sender { color: #34d399; }
    .claude .sender { color: #e89578; }
    .gemini .sender { color: #60a5fa; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: #8b949e; margin-bottom: 0.5rem; gap: 0.5rem; flex-wrap: wrap; }
    .status-left { font-style: italic; }
    .sync-badge { background: #21262d; border: 1px solid #30363d; padding: 0.2rem 0.55rem; border-radius: 99px; font-size: 0.78rem; }
    .sync-ok { color: #3fb950; border-color: #238636; }
    .sync-err { color: #f85149; border-color: #da3633; }
    .composer-row { display: flex; gap: 0.6rem; align-items: flex-end; }
    .composer-row textarea { flex: 1; resize: vertical; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; align-items: center; }
    details summary { cursor: pointer; font-weight: 600; color: #58a6ff; font-size: 0.9rem; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.85rem; color: #c9d1d9; }
    .checkbox-row input { width: auto; margin: 0; }
    .section-title { font-size: 0.85rem; font-weight: 700; color: #58a6ff; text-transform: uppercase; letter-spacing: 0.04em; margin: 0.8rem 0 0.5rem; border-top: 1px solid #30363d; padding-top: 0.8rem; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>AI Group Room</h1>
    <div class="btn-group" style="margin-top:0;">
      <button class="secondary" onclick="syncToGitHub(true)">Sync Now</button>
      <button class="secondary" onclick="downloadTranscript()">Download .md</button>
      <button class="danger" onclick="clearChat()">Clear Chat</button>
    </div>
  </div>

  <div class="card brief-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
      <label style="color:#58a6ff; font-size:0.85rem;">PINNED PROJECT BRIEF & DECISIONS (Always injected into every AI's system prompt)</label>
      <span id="briefSavedTag" style="font-size:0.75rem; color:#8b949e;">Autosaved</span>
    </div>
    <textarea id="projectBrief" class="brief-box" rows="3" placeholder="Pin your current goal, architecture decisions, constraints, or action items here so ChatGPT, Claude, and Gemini never lose track..."></textarea>
  </div>

  <details class="card" open>
    <summary>API Keys, Personas & GitHub Auto-Commit Settings</summary>
    <div class="grid-3" style="margin-top: 0.8rem;">
      <div>
        <label>OpenAI Key (ChatGPT)</label>
        <input type="password" id="openaiKey" placeholder="sk-..." />
      </div>
      <div>
        <label>Anthropic Key (Claude)</label>
        <input type="password" id="claudeKey" placeholder="sk-ant-..." />
      </div>
      <div>
        <label>Google AI Studio Key (Gemini)</label>
        <input type="password" id="geminiKey" placeholder="AIza..." />
      </div>
    </div>

    <div class="grid-3">
      <div>
        <label>ChatGPT Persona (Your close partner)</label>
        <input type="text" id="openaiPersona" value="Close collaborator with the user; practical, sharp, and proactive" />
      </div>
      <div>
        <label>Claude Persona</label>
        <input type="text" id="claudePersona" value="Thoughtful architect who spots edge cases and nuances" />
      </div>
      <div>
        <label>Gemini Persona</label>
        <input type="text" id="geminiPersona" value="Creative systems thinker who connects broader patterns" />
      </div>
    </div>

    <div class="section-title">Direct GitHub Repo Auto-Commit (Optional)</div>
    <div class="grid-3">
      <div>
        <label>GitHub Personal Access Token (PAT)</label>
        <input type="password" id="ghToken" placeholder="github_pat_... or ghp_..." />
      </div>
      <div>
        <label>Repository (owner/repo)</label>
        <input type="text" id="ghRepo" placeholder="username/my-ai-workspace" />
      </div>
      <div>
        <label>File Path & Branch</label>
        <div style="display:flex; gap:0.4rem;">
          <input type="text" id="ghPath" value="transcripts/SHARED_CHAT.md" placeholder="path/to/file.md" style="flex:2;" />
          <input type="text" id="ghBranch" value="main" placeholder="main" style="flex:1;" />
        </div>
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="rememberKeys" />
      <label for="rememberKeys" style="font-weight:normal; color:#c9d1d9; cursor:pointer;">
        Remember API keys & GitHub token in this browser's localStorage
      </label>
    </div>
  </details>

  <div class="chat-box" id="chatBox"></div>
  <div class="status-bar">
    <span class="status-left" id="statusText">Ready. Everyone sees the full transcript + pinned brief.</span>
    <span class="sync-badge" id="syncBadge">GitHub Sync: Not configured</span>
  </div>

  <div class="composer">
    <div class="composer-row">
      <textarea id="userInput" rows="2" placeholder="Jump in anytime or address an AI by name... (Enter to send, Shift+Enter for new line)"></textarea>
      <button id="sendBtn" onclick="sendHumanMessage()">Send</button>
    </div>
    <div class="btn-group">
      <button class="secondary" id="chatgptFirstBtn" onclick="triggerSpecificAI('ChatGPT')">Let ChatGPT Speak First</button>
      <button class="secondary" id="continueBtn" onclick="runOpenFloor()">Let Room Respond</button>
      <button class="danger" id="stopBtn" onclick="stopLoop()" disabled>Pause Room</button>
    </div>
  </div>

<script>
    const KEYS = { TRANSCRIPT: "ai_room_transcript_v2", BRIEF: "ai_room_brief_v2", SETTINGS: "ai_room_settings_v2", SECRETS: "ai_room_secrets_v2" };
    let transcript = JSON.parse(localStorage.getItem(KEYS.TRANSCRIPT) || "[]");
    let isRunning = false, abortRequested = false, syncTimer = null;

    const chatBox = document.getElementById("chatBox"), statusText = document.getElementById("statusText"), syncBadge = document.getElementById("syncBadge"), userInput = document.getElementById("userInput"), projectBrief = document.getElementById("projectBrief");

    loadSavedState();
    renderAll();

    projectBrief.addEventListener("input", () => {
      localStorage.setItem(KEYS.BRIEF, projectBrief.value);
      document.getElementById("briefSavedTag").textContent = "Autosaved";
      scheduleGitHubSync();
    });

    ["openaiPersona", "claudePersona", "geminiPersona", "ghRepo", "ghPath", "ghBranch", "openaiKey", "claudeKey", "geminiKey", "ghToken", "rememberKeys"].forEach(id => {
      document.getElementById(id).addEventListener("input", saveSettingsAndSecrets);
      document.getElementById(id).addEventListener("change", saveSettingsAndSecrets);
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendHumanMessage(); }
    });

    function loadSavedState() {
      projectBrief.value = localStorage.getItem(KEYS.BRIEF) || "";
      const settings = JSON.parse(localStorage.getItem(KEYS.SETTINGS) || "{}");
      if (settings.openaiPersona) document.getElementById("openaiPersona").value = settings.openaiPersona;
      if (settings.claudePersona) document.getElementById("claudePersona").value = settings.claudePersona;
      if (settings.geminiPersona) document.getElementById("geminiPersona").value = settings.geminiPersona;
      if (settings.ghRepo) document.getElementById("ghRepo").value = settings.ghRepo;
      if (settings.ghPath) document.getElementById("ghPath").value = settings.ghPath;
      if (settings.ghBranch) document.getElementById("ghBranch").value = settings.ghBranch;
      document.getElementById("rememberKeys").checked = !!settings.rememberKeys;

      if (settings.rememberKeys) {
        const secrets = JSON.parse(localStorage.getItem(KEYS.SECRETS) || "{}");
        if (secrets.openaiKey) document.getElementById("openaiKey").value = secrets.openaiKey;
        if (secrets.claudeKey) document.getElementById("claudeKey").value = secrets.claudeKey;
        if (secrets.geminiKey) document.getElementById("geminiKey").value = secrets.geminiKey;
        if (secrets.ghToken) document.getElementById("ghToken").value = secrets.ghToken;
      }
      updateSyncBadge();
    }

    function saveSettingsAndSecrets() {
      const remember = document.getElementById("rememberKeys").checked;
      const settings = {
        openaiPersona: document.getElementById("openaiPersona").value,
        claudePersona: document.getElementById("claudePersona").value,
        geminiPersona: document.getElementById("geminiPersona").value,
        ghRepo: document.getElementById("ghRepo").value.trim(),
        ghPath: document.getElementById("ghPath").value.trim(),
        ghBranch: document.getElementById("ghBranch").value.trim(),
        rememberKeys: remember
      };
      localStorage.setItem(KEYS.SETTINGS, JSON.stringify(settings));
      if (remember) {
        localStorage.setItem(KEYS.SECRETS, JSON.stringify({
          openaiKey: document.getElementById("openaiKey").value.trim(),
          claudeKey: document.getElementById("claudeKey").value.trim(),
          geminiKey: document.getElementById("geminiKey").value.trim(),
          ghToken: document.getElementById("ghToken").value.trim()
        }));
      } else {
        localStorage.removeItem(KEYS.SECRETS);
      }
      updateSyncBadge();
    }

    function updateSyncBadge() {
      const token = document.getElementById("ghToken").value.trim(), repo = document.getElementById("ghRepo").value.trim();
      if (token && repo) { syncBadge.textContent = `GitHub Sync: Ready (${repo})`; syncBadge.className = "sync-badge sync-ok"; }
      else { syncBadge.textContent = "GitHub Sync: Not configured"; syncBadge.className = "sync-badge"; }
    }

    function saveTranscript() { localStorage.setItem(KEYS.TRANSCRIPT, JSON.stringify(transcript)); scheduleGitHubSync(); }

    function renderAll() {
      chatBox.innerHTML = "";
      if (transcript.length === 0) {
        chatBox.innerHTML = `<div style="color:#8b949e; text-align:center; margin:auto;">Pin your project brief above, then type below or let ChatGPT kick things off...</div>`;
        return;
      }
      transcript.forEach(msg => appendMessageDOM(msg.css, msg.speaker, msg.text, msg.time));
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessageDOM(css, speaker, text, time) {
      if (transcript.length === 1 && chatBox.firstChild?.style?.textAlign === "center") chatBox.innerHTML = "";
      const div = document.createElement("div");
      div.className = `msg ${css}`;
      div.innerHTML = `<div class="sender"><span>${speaker}</span><span style="font-weight:normal;opacity:0.7;">${time}</span></div><div>${escapeHtml(text).replace(/\n/g, "<br>")}</div>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addMessage(css, speaker, text) {
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      transcript.push({ css, speaker, text, time });
      saveTranscript();
      appendMessageDOM(css, speaker, text, time);
    }

    function escapeHtml(str) { return str.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }

    function buildSystemPrompt(agentName, persona) {
      const brief = projectBrief.value.trim();
      let sys = `You are ${agentName} in a shared group workspace with the User, ChatGPT, Claude, and Gemini.\nYour persona: ${persona}\nEveryone in the room sees every message in the transcript, including direct questions between participants. Note that ChatGPT and the User collaborate closely.`;
      if (brief) sys += `\n\n=== PINNED PROJECT BRIEF & DECISIONS (ALWAYS ACTIVE) ===\n${brief}\n======================================================`;
      return sys;
    }

    function formatTranscriptForPrompt(agentName) {
      const history = transcript.slice(-50).map(m => `${m.speaker}: ${m.text}`).join("\n\n");
      return `Shared room transcript:\n${history || "(Empty room — start a topic or greet the User)"}\n\nInstructions for ${agentName}: Stay aligned with the Pinned Project Brief and all decisions above. Respond naturally in 2-4 concise sentences. If you have nothing meaningful to add right now, reply strictly with the word PASS.`;
    }

    async function callChatGPT(promptText) {
      const key = document.getElementById("openaiKey").value.trim();
      if (!key) throw new Error("Missing OpenAI API key.");
      const res = await fetch("https://openai.com", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          max_tokens: 350,
          messages: [{ role: "system", content: buildSystemPrompt("ChatGPT", document.getElementById("openaiPersona").value) }, { role: "user", content: promptText }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(`ChatGPT: ${data.error?.message || "Error"}`);
      return data.choices[0].message.content.trim();
    }

    async function callClaude(promptText) {
      const key = document.getElementById("claudeKey").value.trim();
      if (!key) throw new Error("Missing Anthropic API key.");
      const res = await fetch("https://anthropic.com", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 350,
          system: buildSystemPrompt("Claude", document.getElementById("claudePersona").value),
          messages: [{ role: "user", content: promptText }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(`Claude: ${data.error?.message || "Error"}`);
      return data.content[0].text.trim();
    }

    async function callGemini(promptText) {
      const key = document.getElementById("geminiKey").value.trim();
      if (!key) throw new Error("Missing Gemini API key.");
      const res = await fetch(`https://googleapis.com{key}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: buildSystemPrompt("Gemini", document.getElementById("geminiPersona").value) }] },
          contents: [{ role: "user", parts: [{ text: promptText }] }],
          generationConfig: { maxOutputTokens: 350 }
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(`Gemini: ${data.error?.message || "Error"}`);
      return data.candidates[0].content.parts[0].text.trim();
    }

    function setControlsState(running) {
      isRunning = running;
      document.getElementById("stopBtn").disabled = !running;
      document.getElementById("continueBtn").disabled = running;
      document.getElementById("chatgptFirstBtn").disabled = running;
    }

    function stopLoop() { abortRequested = true; statusText.textContent = "Pausing after current turn..."; })

    async function sendHumanMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      abortRequested = true;
      userInput.value = "";
Use code with caution.
addMessage("human", "You", text);
setTimeout(() => { if (!isRunning) runOpenFloor(); }, 200);
}
async function triggerSpecificAI(name) {
if (isRunning) return;
setControlsState(true);
abortRequested = false;
try {
statusText.textContent = ${name} is thinking...;
const prompt = formatTranscriptForPrompt(name).replace("If you have nothing meaningful to add right now, reply strictly with the word PASS.", "Kick off or advance the discussion directly.");
const reply = await callChatGPT(prompt);
addMessage("chatgpt", "ChatGPT", reply);
await runOpenFloor(true);
} catch (err) { statusText.textContent = Error: ${err.message}; }
finally { setControlsState(false); }
}
function detectAddressedAgent(text, agents, currentSpeaker) {
const lower = text.toLowerCase();
const mentioned = agents.filter(a => a.name !== currentSpeaker && lower.includes(a.name.toLowerCase()));
return mentioned.length === 1 ? mentioned[0] : null;
}
async function runOpenFloor(skipSetup = false) {
if (isRunning && !skipSetup) return;
setControlsState(true);
abortRequested = false;
const agents = [
{ name: "ChatGPT", css: "chatgpt", fn: callChatGPT },
{ name: "Claude", css: "claude", fn: callClaude },
{ name: "Gemini", css: "gemini", fn: callGemini }
];
try {
for (let round = 0; round < 3; round++) {
let someoneSpoke = false;
const lastMsg = transcript[transcript.length - 1], lastSpeaker = lastMsg?.speaker;
const target = lastMsg ? detectAddressedAgent(lastMsg.text, agents, lastSpeaker) : null;
let order;
if (target) {
const rest = agents.filter(a => a.name !== target.name && a.name !== lastSpeaker);
order = [target, ...rest];
} else {
const others = agents.filter(a => a.name !== lastSpeaker && a.name !== "ChatGPT").sort(() => Math.random() - 0.5);
order = lastSpeaker === "ChatGPT" ? others : [agents[0], ...others];
}
for (const agent of order) {
if (abortRequested) break;
const isTargeted = target && agent.name === target.name;
statusText.textContent = isTargeted ? ${agent.name} was addressed and is replying (everyone sees this)... : Checking if ${agent.name} wants to chime in...;
let prompt = formatTranscriptForPrompt(agent.name);
if (isTargeted) prompt = prompt.replace("If you have nothing meaningful to add right now, reply strictly with the word PASS.", "You were just directly addressed—answer the question or comment directly.");
const reply = await agent.fn(prompt);
if (abortRequested) break;
if (reply.toUpperCase() !== "PASS" && reply.toUpperCase() !== "PASS.") {
addMessage(agent.css, agent.name, reply);
someoneSpoke = true;
if (detectAddressedAgent(reply, agents, agent.name)) break;
}
}
if (abortRequested || !someoneSpoke) break;
}
statusText.textContent = abortRequested ? "Paused for your input." : "Room is waiting for you (or click 'Let Room Respond').";
} catch (err) { statusText.textContent = Error: ${err.message}; }
finally { setControlsState(false); abortRequested = false; }
}
function buildMarkdown() {
const brief = projectBrief.value.trim();
let md = # AI Group Room Transcript\nLast Updated: ${new Date().toLocaleString()}\n\n;
if (brief) md += ## Pinned Project Brief & Decisions\n${brief}\n\n---\n\n;
md += ## Conversation Log\n\n + transcript.map(m => ### ${m.speaker} (${m.time})\n${m.text}).join("\n\n");
return md;
}
function downloadTranscript() {
if (transcript.length === 0 && !projectBrief.value.trim()) return alert("Nothing to download yet.");
const blob = new Blob([buildMarkdown()], { type: "text/markdown" });
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url; a.download = ai-roundtable-${new Date().toISOString().slice(0, 10)}.md; a.click();
URL.revokeObjectURL(url);
}
function scheduleGitHubSync() {
const token = document.getElementById("ghToken").value.trim(), repo = document.getElementById("ghRepo").value.trim();
if (!token || !repo) return;
clearTimeout(syncTimer);
syncBadge.textContent = "GitHub Sync: Queued..."; syncBadge.className = "sync-badge";
syncTimer = setTimeout(() => syncToGitHub(false), 2500);
}
function utf8ToBase64(str) {
const bytes = new TextEncoder().encode(str);
let bin = "";
bytes.forEach(b => bin += String.fromCharCode(b));
return btoa(bin);
}
async function syncToGitHub(manual = false) {
const token = document.getElementById("ghToken").value.trim(), repo = document.getElementById("ghRepo").value.trim(), path = document.getElementById("ghPath").value.trim().replace(/^/+/, ""), branch = document.getElementById("ghBranch").value.trim() || "main";
if (!token || !repo || !path) { if (manual) alert("Enter your GitHub Token, Repository (owner/repo), and File Path first."); return; }
syncBadge.textContent = "GitHub Sync: Committing..."; syncBadge.className = "sync-badge";
const apiUrl = https://github.com{repo}/contents/${path};
const headers = { "Authorization": Bearer ${token}, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" };
try {
let sha = null;
const getRes = await fetch(${apiUrl}?ref=${encodeURIComponent(branch)}, { headers });
if (getRes.ok) { const existing = await getRes.json(); sha = existing.sha; }
else if (getRes.status !== 404) { const errData = await getRes.json(); throw new Error(errData.message || HTTP ${getRes.status}); }
const payload = { message: Update AI roundtable transcript (${new Date().toLocaleTimeString()}), content: utf8ToBase64(buildMarkdown()), branch };
if (sha) payload.sha = sha;
const putRes = await fetch(apiUrl, { method: "PUT", headers, body: JSON.stringify(payload) });
if (!putRes.ok) { const errData = await putRes.json(); throw new Error(errData.message || HTTP ${putRes.status}); }
const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
syncBadge.textContent = GitHub Sync: Saved at ${time}; syncBadge.className = "sync-badge sync-ok";
} catch (err) { syncBadge.textContent = GitHub Sync Error: ${err.message}; syncBadge.className = "sync-badge sync-err"; }
}
function clearChat() {
if (!confirm("Clear the saved conversation? (Your pinned Project Brief will remain.)")) return;
transcript = []; saveTranscript(); renderAll(); statusText.textContent = "Chat cleared.";
}
  </script>
</body>
</html>
