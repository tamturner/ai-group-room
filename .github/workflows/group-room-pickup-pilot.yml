name: Signal a new Group Room pilot request
on:
  push:
    branches:
      - pilot/request-001-scheduled-chat
    paths:
      - 'inbox/turns/turn-*.json'

permissions: {}

jobs:
  signal:
    if: ${{ github.repository == 'tamturner/ai-group-room' && !github.event.created && !github.event.deleted && !github.event.forced }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PICKUP_ENDPOINT: https://ai-group-room-pickup-pilot.bridge-edge-7f29c6.workers.dev/github
    steps:
      - name: Send new turn filenames only
        shell: bash
        run: |
          set -euo pipefail
          before=$(jq -er '.before | select(test("^[a-f0-9]{40}$"))' "$GITHUB_EVENT_PATH")
          after=$(jq -er '.after | select(test("^[a-f0-9]{40}$"))' "$GITHUB_EVENT_PATH")
          compare_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$before...$after?per_page=1"
          payload=$(curl --silent --show-error --fail --max-time 10 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$compare_url" | jq -ce --arg sha "$after" '
              {sha: $sha, files: [.files[] | select(.status == "added") | .filename
                | select(test("^inbox/turns/turn-[0-9]+-[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}\\.json$"))] | unique}
              | select(.files | length <= 25)
            ')
          if [[ "$(jq '.files | length' <<< "$payload")" == 0 ]]; then exit 0; fi
          audience=$(jq -rn --arg url "$PICKUP_ENDPOINT" '$url | @uri')
          endpoint="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$audience"
          token=$(curl --silent --show-error --fail --max-time 10 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$endpoint" | jq -er '.value')
          echo "::add-mask::$token"
          curl --silent --show-error --fail-with-body --max-time 15 --retry 2 \
            --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
            --data-binary "$payload" "$PICKUP_ENDPOINT"
